name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set image name
        id: image
        run: |
          echo "name=${GITHUB_REPOSITORY_OWNER,,}/sym" >> $GITHUB_OUTPUT

      - name: Read LLVM version
        id: llvm-version
        run: |
          LLVM_COMMIT=$(cat build_tools/llvm_version.txt | tr -d '[:space:]')
          echo "commit=$LLVM_COMMIT" >> $GITHUB_OUTPUT
          echo "short_commit=${LLVM_COMMIT:0:12}" >> $GITHUB_OUTPUT

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and test in container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.llvm-version.outputs.short_commit }} \
            bash -c '
              apt-get update -qq && apt-get install -y -qq python3-dev >/dev/null && \
              pip3 install -q pybind11 && \
              cmake -G Ninja -S . -B build/sym \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
                -DMLIR_DIR=/opt/llvm/lib/cmake/mlir \
                -DLLVM_DIR=/opt/llvm/lib/cmake/llvm \
                -DLLVM_EXTERNAL_LIT=$(which lit) \
                -Dpybind11_DIR=$(python3 -m pybind11 --cmakedir) && \
              ninja -C build/sym -j$(nproc) && \
              ctest --test-dir build/sym --output-on-failure && \
              ninja -C build/sym check-sym
            '

      - name: Assert libreloc is MLIR-free
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.llvm-version.outputs.short_commit }} \
            bash -c '
              set -e
              # nm must SUCCEED before its output means anything: a bare
              # "if nm | grep" would false-pass when nm itself errors.
              nm -D build/sym/libreloc/libreloc_runtime.so > /tmp/reloc-syms.txt
              if grep -iE "mlir|llvm" /tmp/reloc-syms.txt; then
                echo "ERROR: MLIR/LLVM symbols found in libreloc_runtime.so" >&2
                exit 1
              fi
              echo "libreloc_runtime.so is MLIR/LLVM-free ($(wc -l < /tmp/reloc-syms.txt) dynamic symbols checked)"

              # nm only sees symbols; a link-only dependency (e.g. a
              # gratuitous target_link_libraries) can add a DT_NEEDED entry
              # with zero undefined symbols, invisible to the check above.
              readelf -d build/sym/libreloc/libreloc_runtime.so > /tmp/reloc-dyn.txt
              if grep -iE "NEEDED.*(mlir|llvm)" /tmp/reloc-dyn.txt; then
                echo "ERROR: MLIR/LLVM DT_NEEDED entry in libreloc_runtime.so" >&2
                exit 1
              fi

              # nm/readelf are both blind to header-only MLIR/LLVM usage
              # (inline-only code exports no symbols and needs no link);
              # grep the sources directly for visibility in CI logs (the
              # authoritative check is the reloc-runtime-no-mlir-includes
              # CTest test, which also runs in this job). Assert grep
              # exits exactly 1: 0 = violating include found, 2 = the scan
              # itself failed (e.g. a scanned directory was renamed away)
              # — treating 2 as "no match" would silently disable this
              # guard forever.
              set +e
              grep -rE '"'"'#include *["<](mlir|llvm)[/"]'"'"' libreloc/src libreloc/include libreloc/cuda
              scan=$?
              set -e
              if [ "$scan" -eq 0 ]; then
                echo "ERROR: MLIR/LLVM header included in libreloc sources" >&2
                exit 1
              elif [ "$scan" -ne 1 ]; then
                echo "ERROR: include scan failed (exit $scan; missing dir?)" >&2
                exit 1
              fi
            '

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          retention-days: 1
          path: |
            build/sym/compile_commands.json
            build/sym/sym/dialect/sym/IR/*.inc
            build/sym/sym/dialect/sym/Transforms/*.inc
            build/sym/sym/dialect/reloc/IR/*.inc
            build/sym/sym/dialect/reloc/Transforms/*.inc
            build/sym/sym/tools/sym-opt
            build/sym/unittest/reloc/reloc-plan-builder-test
            build/sym/libreloc/libreloc_runtime.so
            build/sym/libreloc/test/libreloc-test
            build/sym/test/lit.site.cfg.py
            build/sym/python/pyreloc/_pyreloc*.so
            build/sym/python/pyreloc/__init__.py
            build/sym/python/pyreloc/torch_interop.py

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set image name
        id: image
        run: |
          echo "name=${GITHUB_REPOSITORY_OWNER,,}/sym" >> $GITHUB_OUTPUT

      - name: Read LLVM version
        id: llvm-version
        run: |
          LLVM_COMMIT=$(cat build_tools/llvm_version.txt | tr -d '[:space:]')
          echo "short_commit=${LLVM_COMMIT:0:12}" >> $GITHUB_OUTPUT

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build/sym

      - name: Run clang-tidy in container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.llvm-version.outputs.short_commit }} \
            bash -c '
              apt-get update && apt-get install -y wget lsb-release software-properties-common gnupg && \
              wget https://apt.llvm.org/llvm.sh && chmod +x llvm.sh && ./llvm.sh 21 && \
              apt-get install -y clang-tidy-21 && \
              clang-tidy-21 -p build/sym --warnings-as-errors="*" \
                --extra-arg=-std=c++17 \
                --extra-arg=-isystem/opt/llvm/include \
                -checks="-clang-analyzer-core.StackAddressEscape" \
                -header-filter="^/workspace/sym/.*" \
                sym/dialect/sym/IR/SymDialect.cpp \
                sym/tools/SymOptMain.cpp
            '

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set image name
        id: image
        run: |
          echo "name=${GITHUB_REPOSITORY_OWNER,,}/sym" >> $GITHUB_OUTPUT

      - name: Read LLVM version
        id: llvm-version
        run: |
          LLVM_COMMIT=$(cat build_tools/llvm_version.txt | tr -d '[:space:]')
          echo "short_commit=${LLVM_COMMIT:0:12}" >> $GITHUB_OUTPUT

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build/sym

      - name: Make test binaries executable
        run: |
          chmod +x build/sym/sym/tools/sym-opt
          chmod +x build/sym/unittest/reloc/reloc-plan-builder-test
          chmod +x build/sym/libreloc/libreloc_runtime.so
          chmod +x build/sym/libreloc/test/libreloc-test

      - name: Run tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e LLVM_TOOLS_DIR=/opt/llvm/bin \
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.llvm-version.outputs.short_commit }} \
            bash -c '
              pip install -q lit pytest numpy && \
              lit -sv build/sym/test && \
              PYTHONPATH=/workspace/build/sym/python python3 -c "import pyreloc" && \
              PYTHONPATH=/workspace/build/sym/python python3 -m pytest libreloc/python/tests -q
            '
